<!doctype html>
<html lang="zh-Hans" data-lang="sc" class="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LucidRank</title>
<meta name="description" content="LucidRank web: 10-second check-in, match log, insights and weekly goal for VALORANT / CS2 players. Data stays on your device.">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LucidRank">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/pwa.css">
<!-- shared with the desktop app (copied unchanged from lucidrank-app/src/js) -->
<script src="js/i18n.js"></script>
<!-- web-only -->
<script src="js/pwa-i18n.js"></script>
<script src="js/pwa-adapter.js"></script>
<!-- shared -->
<script src="js/core.js"></script>
</head>
<body class="main-body">
<!-- the shared ring / progress styles reference #gradStroke; on the web it is one flat colour -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gradStroke"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs></svg>
<aside class="side">
  <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.4"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#ff6a3d"/></svg><span class="wm"><b>Lucid</b>Rank</span></div>
  <nav class="nav" id="nav">
    <button data-view="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span data-i18n="nav.today"></span></button>
    <button data-view="matches"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav.matches"></span></button>
    <button data-view="insights"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span data-i18n="nav.insights"></span></button>
    <button data-view="week"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.4 2.4 4.6-5"/></svg><span class="l-long" data-i18n="nav.week"></span><span class="l-short" data-i18n="tab.week"></span></button>
    <button data-open="lineups"><svg viewBox="0 0 24 24"><path d="M5 18c3-9 8-12 14-12"/><circle cx="5" cy="18" r="1.6"/><path d="M16 4l3 2-2 3"/></svg><span class="l-long" data-i18n="nav.lineups"></span><span class="l-short" data-i18n="tab.lineups"></span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg><span data-i18n="nav.settings"></span></button>
  </nav>
  <div class="side-foot">
    <div class="game-pill" id="gamePill" hidden></div>
    <p class="tagline" data-i18n="app.tagline"></p>
  </div>
</aside>
<div class="main-col">
<main class="content" id="content">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-matches"></section>
  <section class="view" id="v-insights"></section>
  <section class="view" id="v-week"></section>
  <section class="view" id="v-settings"></section>
  <section class="view inline-host" id="v-inline"></section>
</main>
</div>
<noscript><p style="padding:24px">LucidRank needs JavaScript.</p></noscript>
<!-- shared with the desktop app -->
<script src="js/stats.js"></script>
<script src="js/checkin.js"></script>
<script src="js/lineups-data.js"></script>
<script src="js/lineups.js"></script>
<script src="js/main.js"></script>
<!-- web-only -->
<script src="js/pwa.js"></script>
</body>
</html>
